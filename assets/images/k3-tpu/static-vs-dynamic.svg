<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Google Sans, Segoe UI, sans-serif">
  <rect width="900" height="400" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">动态 vs 静态 All-to-All：XLA 编译的质变</text>

  <!-- LEFT: Dynamic (Traditional) -->
  <rect x="30" y="50" width="400" height="330" rx="8" fill="#FFF" stroke="#EA4335" stroke-width="1.5" opacity="0.8"/>
  <rect x="30" y="50" width="400" height="30" rx="8" fill="#FCE8E6"/>
  <text x="230" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#C5221F">传统 MoE：动态 All-to-All</text>

  <!-- Timeline bars - Dynamic -->
  <text x="46" y="90" font-size="8.5" fill="#9AA0A6">时间 →</text>

  <text x="46" y="108" font-size="10" fill="#5F6368">Step 1</text>
  <rect x="100" y="95" width="90" height="22" rx="4" fill="#FBBC04" opacity="0.4" stroke="#F9AB00" stroke-width="0.5"/>
  <text x="145" y="110" text-anchor="middle" font-size="9" fill="#3C4043">Router</text>

  <text x="46" y="138" font-size="10" fill="#5F6368">Step 2</text>
  <rect x="190" y="125" width="70" height="22" rx="4" fill="#EA4335" opacity="0.3" stroke="#EA4335" stroke-width="0.5"/>
  <text x="225" y="140" text-anchor="middle" font-size="9" fill="#C5221F">Host 统计</text>

  <line x1="262" y1="88" x2="262" y2="245" stroke="#EA4335" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="266" y="163" font-size="9" fill="#EA4335" font-weight="600">⚠️ 同步点</text>
  <text x="266" y="175" font-size="8.5" fill="#EA4335">此前无法启动通信</text>

  <text x="46" y="198" font-size="10" fill="#5F6368">Step 3</text>
  <rect x="266" y="185" width="60" height="22" rx="4" fill="#9334E6" opacity="0.2" stroke="#9334E6" stroke-width="0.5"/>
  <text x="296" y="200" text-anchor="middle" font-size="9" fill="#7627BB">A2A</text>

  <text x="46" y="228" font-size="10" fill="#5F6368">Step 4</text>
  <rect x="328" y="215" width="82" height="22" rx="4" fill="#1A73E8" opacity="0.2" stroke="#1A73E8" stroke-width="0.5"/>
  <text x="369" y="230" text-anchor="middle" font-size="9" fill="#1967D2">Expert FFN</text>

  <line x1="100" y1="246" x2="410" y2="246" stroke="#9AA0A6" stroke-width="1"/>
  <text x="255" y="257" text-anchor="middle" font-size="8.5" fill="#5F6368">总时长（基准 100%）</text>

  <!-- Dynamic summary -->
  <rect x="50" y="255" width="360" height="55" rx="6" fill="#FCE8E6" opacity="0.5"/>
  <text x="230" y="275" text-anchor="middle" font-size="10" fill="#C5221F">❌ 每 step 重新规划通信</text>
  <text x="230" y="291" text-anchor="middle" font-size="10" fill="#C5221F">❌ Host-Device 同步阻塞</text>
  <text x="230" y="307" text-anchor="middle" font-size="10" fill="#C5221F">❌ 计算和通信无法 overlap</text>

  <!-- Compiled? -->
  <rect x="50" y="325" width="360" height="30" rx="6" fill="#FEEFC3"/>
  <text x="230" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#E37400">XLA 只能编译 Expert FFN 部分 ⚡</text>

  <!-- RIGHT: Static (K3) -->
  <rect x="470" y="50" width="400" height="330" rx="8" fill="#FFF" stroke="#34A853" stroke-width="1.5" opacity="0.8"/>
  <rect x="470" y="50" width="400" height="30" rx="8" fill="#E6F4EA"/>
  <text x="670" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#137333">K3 + MoonEP：静态 All-to-All</text>

  <!-- Timeline bars - Static (overlapped) -->
  <text x="486" y="90" font-size="8.5" fill="#9AA0A6">时间 →（与左图同刻度）</text>

  <text x="486" y="108" font-size="10" fill="#5F6368">编译时</text>
  <rect x="540" y="95" width="290" height="22" rx="4" fill="#34A853" opacity="0.15" stroke="#34A853" stroke-width="0.5"/>
  <text x="685" y="110" text-anchor="middle" font-size="9" fill="#137333">XLA 编译 MoE 通信路径（dispatch / combine）</text>

  <text x="486" y="148" font-size="10" fill="#5F6368">运行时</text>
  <text x="486" y="160" font-size="8.5" fill="#137333">无同步点</text>

  <rect x="540" y="155" width="80" height="22" rx="4" fill="#FBBC04" opacity="0.4" stroke="#F9AB00" stroke-width="0.5"/>
  <text x="580" y="170" text-anchor="middle" font-size="9" fill="#3C4043">Router</text>

  <rect x="620" y="183" width="70" height="22" rx="4" fill="#9334E6" opacity="0.2" stroke="#9334E6" stroke-width="0.5"/>
  <text x="655" y="198" text-anchor="middle" font-size="9" fill="#7627BB">A2A</text>

  <rect x="632" y="211" width="118" height="22" rx="4" fill="#1A73E8" opacity="0.2" stroke="#1A73E8" stroke-width="0.5"/>
  <text x="691" y="226" text-anchor="middle" font-size="9" fill="#1967D2">其他层计算（并行）</text>

  <line x1="632" y1="206" x2="690" y2="206" stroke="#34A853" stroke-width="2"/>
  <text x="700" y="210" font-size="8.5" font-weight="600" fill="#34A853">通信可被计算掩盖</text>

  <line x1="540" y1="246" x2="750" y2="246" stroke="#34A853" stroke-width="1.5"/>
  <text x="645" y="257" text-anchor="middle" font-size="8.5" fill="#137333" font-weight="600">总时长缩短（同刻度下更短）</text>

  <!-- Static summary -->
  <rect x="490" y="255" width="360" height="55" rx="6" fill="#E6F4EA" opacity="0.5"/>
  <text x="670" y="275" text-anchor="middle" font-size="10" fill="#137333">✅ 编译时已知所有通信形状</text>
  <text x="670" y="291" text-anchor="middle" font-size="10" fill="#137333">✅ 消除 per-layer MoE Host 同步</text>
  <text x="670" y="307" text-anchor="middle" font-size="10" fill="#137333">✅ overlap 策略可编译期规划</text>

  <!-- Compiled? -->
  <rect x="490" y="325" width="360" height="30" rx="6" fill="#E6F4EA"/>
  <text x="670" y="340" text-anchor="middle" font-size="10.5" font-weight="600" fill="#137333">XLA 编译 MoE 通信路径 ✨</text>
  <text x="670" y="352" text-anchor="middle" font-size="8.5" fill="#5F6368">计算侧逐专家仍 ragged，需 grouped matmul</text>
</svg>
