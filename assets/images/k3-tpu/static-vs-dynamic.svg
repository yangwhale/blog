<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Google Sans, Segoe UI, sans-serif">
  <rect width="900" height="400" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">动态 vs 静态 All-to-All：XLA 编译的质变</text>

  <!-- LEFT: Dynamic (Traditional) -->
  <rect x="30" y="50" width="400" height="330" rx="8" fill="#FFF" stroke="#EA4335" stroke-width="1.5" opacity="0.8"/>
  <rect x="30" y="50" width="400" height="30" rx="8" fill="#FCE8E6"/>
  <text x="230" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#C5221F">传统 MoE：动态 All-to-All</text>

  <!-- Timeline bars - Dynamic -->
  <text x="50" y="108" font-size="10" fill="#5F6368">Step 1</text>
  <rect x="110" y="95" width="140" height="22" rx="4" fill="#FBBC04" opacity="0.4" stroke="#F9AB00" stroke-width="0.5"/>
  <text x="180" y="110" text-anchor="middle" font-size="9" fill="#3C4043">Router 计算 (TensorCore)</text>

  <text x="50" y="138" font-size="10" fill="#5F6368">Step 2</text>
  <rect x="250" y="125" width="80" height="22" rx="4" fill="#EA4335" opacity="0.3" stroke="#EA4335" stroke-width="0.5"/>
  <text x="290" y="140" text-anchor="middle" font-size="9" fill="#C5221F">Host 统计</text>

  <text x="50" y="165" font-size="10" fill="#EA4335" font-weight="600">⚠️ 同步</text>
  <line x1="110" y1="158" x2="400" y2="158" stroke="#EA4335" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="320" y="170" font-size="9" fill="#EA4335">Device 等 Host 规划完</text>

  <text x="50" y="198" font-size="10" fill="#5F6368">Step 3</text>
  <rect x="110" y="185" width="100" height="22" rx="4" fill="#9334E6" opacity="0.2" stroke="#9334E6" stroke-width="0.5"/>
  <text x="160" y="200" text-anchor="middle" font-size="9" fill="#7627BB">All-to-All</text>

  <text x="50" y="228" font-size="10" fill="#5F6368">Step 4</text>
  <rect x="210" y="215" width="180" height="22" rx="4" fill="#1A73E8" opacity="0.2" stroke="#1A73E8" stroke-width="0.5"/>
  <text x="300" y="230" text-anchor="middle" font-size="9" fill="#1967D2">Expert FFN 计算</text>

  <!-- Dynamic summary -->
  <rect x="50" y="255" width="360" height="55" rx="6" fill="#FCE8E6" opacity="0.5"/>
  <text x="230" y="275" text-anchor="middle" font-size="10" fill="#C5221F">❌ 每 step 重新规划通信</text>
  <text x="230" y="291" text-anchor="middle" font-size="10" fill="#C5221F">❌ Host-Device 同步阻塞</text>
  <text x="230" y="307" text-anchor="middle" font-size="10" fill="#C5221F">❌ 计算和通信无法 overlap</text>

  <!-- Compiled? -->
  <rect x="50" y="325" width="360" height="30" rx="6" fill="#FEEFC3"/>
  <text x="230" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#E37400">XLA 只能编译 Expert FFN 部分 ⚡</text>

  <!-- RIGHT: Static (K3) -->
  <rect x="470" y="50" width="400" height="330" rx="8" fill="#FFF" stroke="#34A853" stroke-width="1.5" opacity="0.8"/>
  <rect x="470" y="50" width="400" height="30" rx="8" fill="#E6F4EA"/>
  <text x="670" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#137333">K3 + MoonEP：静态 All-to-All</text>

  <!-- Timeline bars - Static (overlapped) -->
  <text x="490" y="108" font-size="10" fill="#5F6368">编译时</text>
  <rect x="570" y="95" width="280" height="22" rx="4" fill="#34A853" opacity="0.15" stroke="#34A853" stroke-width="0.5"/>
  <text x="710" y="110" text-anchor="middle" font-size="9" fill="#137333">XLA 编译 MoE 通信路径（dispatch / combine）</text>

  <text x="490" y="148" font-size="10" fill="#5F6368">运行时</text>

  <!-- Overlapping bars showing perfect overlap -->
  <rect x="570" y="155" width="120" height="22" rx="4" fill="#FBBC04" opacity="0.4" stroke="#F9AB00" stroke-width="0.5"/>
  <text x="630" y="170" text-anchor="middle" font-size="9" fill="#3C4043">Router</text>

  <rect x="570" y="183" width="120" height="22" rx="4" fill="#9334E6" opacity="0.2" stroke="#9334E6" stroke-width="0.5"/>
  <text x="630" y="198" text-anchor="middle" font-size="9" fill="#7627BB">All-to-All</text>

  <rect x="620" y="183" width="230" height="22" rx="4" fill="#1A73E8" opacity="0.2" stroke="#1A73E8" stroke-width="0.5"/>
  <text x="735" y="198" text-anchor="middle" font-size="9" fill="#1967D2">Expert FFN 计算 (overlap!)</text>

  <!-- Overlap bracket -->
  <line x1="620" y1="210" x2="690" y2="210" stroke="#34A853" stroke-width="2"/>
  <text x="655" y="224" text-anchor="middle" font-size="9" font-weight="600" fill="#34A853">通信可被计算掩盖</text>

  <!-- Static summary -->
  <rect x="490" y="255" width="360" height="55" rx="6" fill="#E6F4EA" opacity="0.5"/>
  <text x="670" y="275" text-anchor="middle" font-size="10" fill="#137333">✅ 编译时已知所有通信形状</text>
  <text x="670" y="291" text-anchor="middle" font-size="10" fill="#137333">✅ 消除 per-layer MoE Host 同步</text>
  <text x="670" y="307" text-anchor="middle" font-size="10" fill="#137333">✅ overlap 策略可编译期规划</text>

  <!-- Compiled? -->
  <rect x="490" y="325" width="360" height="30" rx="6" fill="#E6F4EA"/>
  <text x="670" y="340" text-anchor="middle" font-size="10.5" font-weight="600" fill="#137333">XLA 编译 MoE 通信路径 ✨</text>
  <text x="670" y="352" text-anchor="middle" font-size="8.5" fill="#5F6368">计算侧逐专家仍 ragged，需 grouped matmul</text>
</svg>
