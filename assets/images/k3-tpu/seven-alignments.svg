<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Google Sans, Segoe UI, sans-serif">
  <rect width="900" height="620" fill="#FAFAFA" rx="8"/>

  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">改版盘点：8 项收益条目 + 1 项反例 · TPU 边际收益审视</text>
  <text x="450" y="48" text-anchor="middle" font-size="10.5" fill="#5F6368">改版 2026-07-29 · ⚡ TPU 独有放大 &#160;·&#160; 🔧 收益大但需自建 &#160;·&#160; ➖ 边际收益相当 &#160;·&#160; ❌ 反例</text>

  <text x="120" y="76" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E37400">K3 的设计</text>
  <text x="300" y="76" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5F6368">Moonshot 的动机</text>
  <text x="404" y="76" font-size="11.5" font-weight="600" fill="#5F6368">TPU 上的收益 / 代价</text>
  <text x="825" y="76" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A73E8">判定</text>
  <line x1="30" y1="86" x2="870" y2="86" stroke="#DADCE0" stroke-width="1"/>
  <line x1="396" y1="90" x2="396" y2="608" stroke="#E8EAED" stroke-width="1"/>
  <line x1="782" y1="90" x2="782" y2="608" stroke="#E8EAED" stroke-width="1"/>

  <!-- Row 1: KDA 3:1 + Gated MLA -->
  <rect x="30" y="94" width="840" height="54" rx="4" fill="#E6F4EA" opacity="0.55"/>
  <rect x="38" y="102" width="164" height="38" rx="6" fill="#F9AB00" opacity="0.15" stroke="#F9AB00" stroke-width="1"/>
  <text x="120" y="119" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E37400">KDA 3:1 + Gated MLA</text>
  <text x="120" y="133" text-anchor="middle" font-size="9" fill="#B06000">69 层 KDA / 24 层全注意力</text>
  <text x="300" y="117" text-anchor="middle" font-size="9.5" fill="#3C4043">长序列推理效率</text>
  <text x="300" y="131" text-anchor="middle" font-size="9.5" fill="#3C4043">固定大小递归状态</text>
  <text x="404" y="117" font-size="9.5" font-weight="600" fill="#137333">常数 state 消除 XLA「按最大长度预分配 KV」的浪费</text>
  <text x="404" y="131" font-size="9.5" fill="#B06000">代价：投机解码状态难回滚 · 前缀缓存复杂化 · 三种 regime 仅覆盖一种</text>
  <text x="825" y="117" text-anchor="middle" font-size="16">⚡</text>
  <text x="825" y="134" text-anchor="middle" font-size="9" fill="#137333">TPU 独有放大</text>

  <!-- Row 2: MoonEP -->
  <rect x="30" y="152" width="840" height="54" rx="4" fill="white"/>
  <rect x="38" y="160" width="164" height="38" rx="6" fill="#1A73E8" opacity="0.12" stroke="#1A73E8" stroke-width="1"/>
  <text x="120" y="177" text-anchor="middle" font-size="10.5" font-weight="600" fill="#174EA6">MoonEP</text>
  <text x="120" y="191" text-anchor="middle" font-size="9" fill="#1A73E8">系统层，非模型权重</text>
  <text x="300" y="175" text-anchor="middle" font-size="9.5" fill="#3C4043">消除 EP 负载不均</text>
  <text x="300" y="189" text-anchor="middle" font-size="9.5" fill="#3C4043">与显存碎片</text>
  <text x="404" y="175" font-size="9.5" font-weight="600" fill="#137333">rank 级 S×K 静态形状 → 消除每层 Host 同步、固定 A2A buffer</text>
  <text x="404" y="189" font-size="9.5" fill="#C5221F">但整套围绕 NCCL / DeepEP，TPU 上必须重写</text>
  <text x="825" y="175" text-anchor="middle" font-size="16">🔧</text>
  <text x="825" y="192" text-anchor="middle" font-size="9" fill="#B06000">需自建</text>

  <!-- Row 3: Quantile Balancing -->
  <rect x="30" y="210" width="840" height="54" rx="4" fill="#E6F4EA" opacity="0.55"/>
  <rect x="38" y="218" width="164" height="38" rx="6" fill="#F9AB00" opacity="0.15" stroke="#F9AB00" stroke-width="1"/>
  <text x="120" y="235" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E37400">Quantile Balancing</text>
  <text x="120" y="249" text-anchor="middle" font-size="9" fill="#B06000">Top-k + 偏置，非新路由</text>
  <text x="300" y="233" text-anchor="middle" font-size="9.5" fill="#3C4043">896 专家下定步长偏置</text>
  <text x="300" y="247" text-anchor="middle" font-size="9.5" fill="#3C4043">更新已难以维持</text>
  <text x="404" y="233" font-size="9.5" fill="#3C4043">压低 MoonEP 实际迁移成本、收窄 ragged 最坏情况</text>
  <text x="404" y="247" font-size="9.5" fill="#137333">直方图 scatter_add 正好是 SparseCore 形状的负载</text>
  <text x="825" y="233" text-anchor="middle" font-size="16">➖</text>
  <text x="825" y="250" text-anchor="middle" font-size="9" fill="#5F6368">相当</text>

  <!-- Row 4: KDA lower-bounded decay -->
  <rect x="30" y="268" width="840" height="54" rx="4" fill="white"/>
  <rect x="38" y="276" width="164" height="38" rx="6" fill="#F9AB00" opacity="0.15" stroke="#F9AB00" stroke-width="1"/>
  <text x="120" y="293" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E37400">KDA 下界衰减</text>
  <text x="120" y="307" text-anchor="middle" font-size="9" fill="#B06000">g_min = −5</text>
  <text x="300" y="291" text-anchor="middle" font-size="9.5" fill="#3C4043">消掉 position-pair 对角路径</text>
  <text x="300" y="305" text-anchor="middle" font-size="9.5" fill="#3C4043">——块内主瓶颈</text>
  <text x="404" y="291" font-size="9.5" font-weight="600" fill="#137333">全部 tile 落回稠密矩阵乘 —— MXU 的本命</text>
  <text x="404" y="305" font-size="9.5" fill="#5F6368">受益机制 GPU / TPU 相同，但对 TPU 极重要</text>
  <text x="825" y="291" text-anchor="middle" font-size="16">➖</text>
  <text x="825" y="308" text-anchor="middle" font-size="9" fill="#5F6368">相当</text>

  <!-- Row 5: Stable LatentMoE -->
  <rect x="30" y="326" width="840" height="54" rx="4" fill="#E6F4EA" opacity="0.55"/>
  <rect x="38" y="334" width="164" height="38" rx="6" fill="#F9AB00" opacity="0.15" stroke="#F9AB00" stroke-width="1"/>
  <text x="120" y="351" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E37400">Stable LatentMoE</text>
  <text x="120" y="365" text-anchor="middle" font-size="9" fill="#B06000">7168 → 3584</text>
  <text x="300" y="349" text-anchor="middle" font-size="9.5" fill="#3C4043">扩专家池而不让</text>
  <text x="300" y="363" text-anchor="middle" font-size="9.5" fill="#3C4043">通信同比增长</text>
  <text x="404" y="349" font-size="9.5" fill="#137333">同等激活数下逐专家宽度减半</text>
  <text x="404" y="363" font-size="9.5" fill="#C5221F">K3 用它把激活数 8→16，净流量持平；解码侧 token-centric 对 TPU 不利</text>
  <text x="825" y="349" text-anchor="middle" font-size="16">➖</text>
  <text x="825" y="366" text-anchor="middle" font-size="9" fill="#5F6368">训练相当 / 解码不利</text>

  <!-- Row 6: SiTU-GLU -->
  <rect x="30" y="384" width="840" height="54" rx="4" fill="white"/>
  <rect x="38" y="392" width="164" height="38" rx="6" fill="#F9AB00" opacity="0.15" stroke="#F9AB00" stroke-width="1"/>
  <text x="120" y="409" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E37400">SiTU-GLU</text>
  <text x="120" y="423" text-anchor="middle" font-size="9" fill="#B06000">β₁=4, β₂=25, |f| ≤ 100</text>
  <text x="300" y="407" text-anchor="middle" font-size="9.5" fill="#3C4043">压住低精度下的</text>
  <text x="300" y="421" text-anchor="middle" font-size="9.5" fill="#3C4043">激活溢出（MXFP8）</text>
  <text x="404" y="407" font-size="9.5" fill="#3C4043">tanh + sigmoid + 逐元素乘，全 XLA 原生，移植零障碍</text>
  <text x="404" y="421" font-size="9.5" fill="#C5221F">但它服务的 MX 量化路径，XLA:TPU 无原生 dtype</text>
  <text x="825" y="407" text-anchor="middle" font-size="16">➖</text>
  <text x="825" y="424" text-anchor="middle" font-size="9" fill="#5F6368">相当</text>

  <!-- Row 7: AttnRes -->
  <rect x="30" y="442" width="840" height="54" rx="4" fill="#E6F4EA" opacity="0.55"/>
  <rect x="38" y="450" width="164" height="38" rx="6" fill="#F9AB00" opacity="0.15" stroke="#F9AB00" stroke-width="1"/>
  <text x="120" y="467" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E37400">Block AttnRes</text>
  <text x="120" y="481" text-anchor="middle" font-size="9" fill="#B06000">8 块 × 12 层（末块不满）</text>
  <text x="300" y="465" text-anchor="middle" font-size="9.5" fill="#3C4043">跨深度信息流</text>
  <text x="300" y="479" text-anchor="middle" font-size="9.5" fill="#3C4043">+ 模型质量</text>
  <text x="404" y="465" font-size="9.5" fill="#3C4043">Block 化后 O(Nd)，全部 XLA 原生算子</text>
  <text x="404" y="479" font-size="9.5" fill="#5F6368">它替代的传统残差同样 XLA 友好</text>
  <text x="825" y="465" text-anchor="middle" font-size="16">➖</text>
  <text x="825" y="482" text-anchor="middle" font-size="9" fill="#5F6368">相当</text>

  <!-- Row 8: Per-Head Muon -->
  <rect x="30" y="500" width="840" height="54" rx="4" fill="white"/>
  <rect x="38" y="508" width="164" height="38" rx="6" fill="#F9AB00" opacity="0.15" stroke="#F9AB00" stroke-width="1"/>
  <text x="120" y="525" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E37400">Per-Head Muon</text>
  <text x="120" y="539" text-anchor="middle" font-size="9" fill="#B06000">96 个 head</text>
  <text x="300" y="523" text-anchor="middle" font-size="9.5" fill="#3C4043">均衡各头更新尺度</text>
  <text x="300" y="537" text-anchor="middle" font-size="9.5" fill="#3C4043">提升大规模训练稳定性</text>
  <text x="404" y="523" font-size="9.5" fill="#3C4043">正交化算术是 batch matmul，jax.vmap 直出</text>
  <text x="404" y="537" font-size="9.5" fill="#C5221F">但真瓶颈是 P2P 参数聚集，XLA 无对应原语</text>
  <text x="825" y="523" text-anchor="middle" font-size="16">➖</text>
  <text x="825" y="540" text-anchor="middle" font-size="9" fill="#5F6368">半白捡</text>

  <!-- Row 9: Native multimodal (counterexample) -->
  <rect x="30" y="558" width="840" height="54" rx="4" fill="#FCE8E6" opacity="0.6"/>
  <rect x="38" y="566" width="164" height="38" rx="6" fill="#EA4335" opacity="0.12" stroke="#C5221F" stroke-width="1"/>
  <text x="120" y="583" text-anchor="middle" font-size="10.5" font-weight="600" fill="#A50E0E">原生多模态</text>
  <text x="120" y="597" text-anchor="middle" font-size="9" fill="#C5221F">MoonViT-V2</text>
  <text x="300" y="581" text-anchor="middle" font-size="9.5" fill="#3C4043">视觉在环的长程 agent</text>
  <text x="300" y="595" text-anchor="middle" font-size="9.5" fill="#3C4043">代码 → 截图 → 修正</text>
  <text x="404" y="581" font-size="9.5" font-weight="600" fill="#C5221F">变长视觉 token 无法交还编译期 —— K3 自己也只是「接住」它</text>
  <text x="404" y="595" font-size="9.5" fill="#5F6368">TPU 上只能分桶 padding，或实现变长 CP</text>
  <text x="825" y="581" text-anchor="middle" font-size="16">❌</text>
  <text x="825" y="598" text-anchor="middle" font-size="9" fill="#C5221F">反例</text>
</svg>
