<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Google Sans, Segoe UI, sans-serif">
  <rect width="860" height="340" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">KV Cache 革命：从 280GB 到 15GB</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#5F6368">K3 的 KDA 3:1 + Gated MLA 让 TPU 单 chip 承载 256K 上下文</text>

  <!-- LEFT: Traditional MHA -->
  <rect x="30" y="62" width="260" height="255" rx="8" fill="#FFF" stroke="#EA4335" stroke-width="1.5"/>
  <rect x="30" y="62" width="260" height="28" rx="8" fill="#FCE8E6"/>
  <text x="160" y="81" text-anchor="middle" font-size="12" font-weight="600" fill="#C5221F">传统 MHA (如 Llama-405B)</text>

  <!-- MHA HBM bars -->
  <text x="50" y="115" font-size="10" fill="#5F6368">Layer 1-126</text>
  <rect x="50" y="120" width="220" height="100" rx="4" fill="#EA4335" opacity="0.15" stroke="#EA4335" stroke-width="0.5"/>
  <text x="160" y="155" text-anchor="middle" font-size="9" fill="#C5221F">每层 K cache: num_heads × d_head × seq_len</text>
  <text x="160" y="170" text-anchor="middle" font-size="9" fill="#C5221F">每层 V cache: num_heads × d_head × seq_len</text>
  <text x="160" y="185" text-anchor="middle" font-size="9" fill="#C5221F">128 heads × 128 dim × 256K</text>
  <text x="160" y="205" text-anchor="middle" font-size="9" fill="#EA4335">= 每层 8.6GB (BF16)</text>

  <!-- MHA total -->
  <rect x="50" y="232" width="220" height="38" rx="6" fill="#FCE8E6"/>
  <text x="160" y="248" text-anchor="middle" font-size="11" fill="#C5221F">总 KV cache:</text>
  <text x="160" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#EA4335">~280 GB</text>

  <!-- verdict -->
  <text x="160" y="300" text-anchor="middle" font-size="10" fill="#EA4335">❌ 需 3+ TPU chips 放 KV cache</text>

  <!-- MIDDLE: Arrow -->
  <text x="330" y="185" text-anchor="middle" font-size="28" fill="#34A853">→</text>

  <!-- RIGHT: K3 KDA+MLA -->
  <rect x="370" y="62" width="460" height="255" rx="8" fill="#FFF" stroke="#34A853" stroke-width="1.5"/>
  <rect x="370" y="62" width="460" height="28" rx="8" fill="#E6F4EA"/>
  <text x="600" y="81" text-anchor="middle" font-size="12" font-weight="600" fill="#137333">K3: KDA 3:1 + Gated MLA (2B-A16B)</text>

  <!-- KDA layers -->
  <text x="390" y="110" font-size="10" fill="#1A73E8" font-weight="600">KDA × 3 层 (每 4 层中 3 层)</text>
  <rect x="390" y="115" width="200" height="45" rx="4" fill="#1A73E8" opacity="0.1" stroke="#1A73E8" stroke-width="0.5"/>
  <text x="490" y="133" text-anchor="middle" font-size="9" fill="#1967D2">线性注意力 → 恒定 KV 状态</text>
  <text x="490" y="148" text-anchor="middle" font-size="9" fill="#1967D2">大小与 seq_len 无关</text>
  <text x="600" y="140" font-size="12" fill="#34A853" font-weight="700">≈ 0 GB</text>

  <!-- MLA layers -->
  <text x="390" y="180" font-size="10" fill="#9334E6" font-weight="600">Gated MLA × 1 层 (每 4 层中 1 层)</text>
  <rect x="390" y="185" width="200" height="45" rx="4" fill="#9334E6" opacity="0.1" stroke="#9334E6" stroke-width="0.5"/>
  <text x="490" y="203" text-anchor="middle" font-size="9" fill="#7627BB">低秩 KV：latent_dim = 512</text>
  <text x="490" y="218" text-anchor="middle" font-size="9" fill="#7627BB">1 rope head + latent 共享</text>
  <text x="600" y="210" font-size="12" fill="#34A853" font-weight="700">~15 GB</text>

  <!-- K3 total -->
  <rect x="390" y="240" width="420" height="38" rx="6" fill="#E6F4EA"/>
  <text x="600" y="256" text-anchor="middle" font-size="11" fill="#137333">总 KV cache:</text>
  <text x="600" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#34A853">~15 GB (↓ 94.6%)</text>

  <!-- verdict -->
  <text x="600" y="303" text-anchor="middle" font-size="10" fill="#137333">✅ 单 TPU chip 192GB HBM → KV cache 只用 8%</text>
</svg>
